<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nachricht gesendet – Lakesights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --brown-dark: #3d2e1e;
      --brown-medium: #7a6352;
      --brown-muted: #9a8979;
      --brown-light: #c4b5a4;
      --warm-bg: #f0ebe4;
      --warm-bg-alt: #e8e1d8;
      --white: #ffffff;
      --accent: #3d7a5a;
      --accent-light: #e2f0e8;
      --accent-hover: #2e6346;
      --font: 'Albert Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --max-w: 1100px;
      --section-py: 110px;
      --card-radius: 14px;
      --card-border: 1px solid rgba(0,0,0,0.06);
      --card-shadow: 0 1px 4px rgba(60,46,30,0.05);
    }

    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      font-family: var(--font); color: var(--brown-dark);
      background: var(--warm-bg); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── RIBBON NAV ── */
    .ribbon {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 14px 40px;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .ribbon.scrolled {
      background: rgba(240,235,228,0.82);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 2px 20px rgba(60,46,30,0.07);
    }
    .ribbon-inner { max-width: var(--max-w); margin: 0 auto; }
    .ribbon-bar {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 50px; padding: 6px 8px;
      box-shadow: 0 1px 12px rgba(60,46,30,0.08);
    }
    .ribbon-logo {
      font-size: 1.3rem; font-weight: 700; color: var(--brown-dark);
      text-decoration: none; letter-spacing: -0.03em;
      padding: 8px 24px 8px 20px; white-space: nowrap;
      border-right: 1px solid var(--warm-bg-alt); margin-right: 8px;
    }
    .ribbon-links { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .ribbon-link {
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--brown-medium);
      text-decoration: none; padding: 10px 20px;
      border-radius: 40px; transition: all 0.2s; white-space: nowrap;
    }
    .ribbon-link:hover { color: var(--brown-dark); background: rgba(240,235,228,0.7); }
    .ribbon-link.active { background: var(--accent-light); color: var(--accent); }

    .hamburger {
      display: none; background: none; border: none; cursor: pointer;
      width: 26px; height: 18px; position: relative; z-index: 200;
      margin-left: auto; margin-right: 8px;
    }
    .hamburger span {
      display: block; width: 100%; height: 2px; background: var(--brown-dark);
      position: absolute; left: 0; transition: 0.3s; border-radius: 2px;
    }
    .hamburger span:nth-child(1) { top: 0; }
    .hamburger span:nth-child(2) { top: 8px; }
    .hamburger span:nth-child(3) { top: 16px; }
    .hamburger.active span:nth-child(1) { top: 8px; transform: rotate(45deg); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { top: 8px; transform: rotate(-45deg); }

    .mobile-menu {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--warm-bg); z-index: 150;
      flex-direction: column; justify-content: center; align-items: center; gap: 24px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-size: 1.1rem; font-weight: 600; color: var(--brown-dark);
      text-decoration: none; padding: 12px 32px; border-radius: 40px;
      transition: background 0.2s;
    }
    .mobile-menu a:hover { background: var(--white); }

    /* ── CONTAINER & SECTIONS ── */
    .container { max-width: var(--max-w); margin: 0 auto; padding: 0 40px; }
    section { padding: var(--section-py) 0; }
    section:first-of-type { padding-top: 140px; }
    .bg-warm { background: var(--warm-bg); }

    /* ── SUCCESS CONTENT ── */
    .success-wrap { max-width: 700px; }
    .success-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--accent-light); display: flex;
      align-items: center; justify-content: center; margin-bottom: 32px;
    }
    .success-icon svg { width: 28px; height: 28px; stroke: var(--accent); }
    .success-title {
      font-weight: 300; font-size: clamp(1.9rem, 3.2vw, 2.7rem);
      line-height: 1.18; letter-spacing: -0.02em; margin-bottom: 24px;
    }
    .success-title strong { font-weight: 700; }
    .success-text {
      font-size: 1.05rem; line-height: 1.8; color: var(--brown-medium);
      margin-bottom: 40px;
    }
    .success-btn {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--font); font-size: 0.85rem; font-weight: 600;
      color: var(--white); background: var(--accent);
      border: none; border-radius: 50px; padding: 14px 32px;
      text-decoration: none; cursor: pointer; transition: background 0.2s;
    }
    .success-btn:hover { background: var(--accent-hover); }
    .success-btn svg { width: 16px; height: 16px; stroke: currentColor; }

    /* ── FOOTER ── */
    .footer { background: var(--white); border-top: 1px solid var(--warm-bg-alt); padding: 40px 0; }
    .footer-inner {
      max-width: var(--max-w); margin: 0 auto; padding: 0 40px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 20px;
    }
    .footer-logo { font-size: 1.15rem; font-weight: 700; color: var(--brown-dark); text-decoration: none; letter-spacing: -0.03em; }
    .footer-links { display: flex; gap: 28px; }
    .footer-links a { font-size: 0.8rem; color: var(--brown-muted); text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: var(--brown-dark); }
    .footer-copy {
      font-size: 0.75rem; color: var(--brown-light); width: 100%;
      text-align: center; margin-top: 28px; padding-top: 28px;
      border-top: 1px solid var(--warm-bg);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      :root { --section-py: 72px; }
      .ribbon { padding: 10px 16px; }
      .ribbon-links { display: none; }
      .hamburger { display: block; }
      .container { padding: 0 20px; }
      section:first-of-type { padding-top: 100px; }
      .footer-inner { flex-direction: column; text-align: center; padding: 0 20px; }
      .footer-links { justify-content: center; }
    }
    @media (min-width: 769px) and (max-width: 1024px) {
      .container { padding: 0 32px; }
      .ribbon { padding: 12px 32px; }
      .footer-inner { padding: 0 32px; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="ribbon" id="ribbon">
    <div class="ribbon-inner">
      <div class="ribbon-bar">
        <a href="index.html" class="ribbon-logo">Lakesights</a>
        <button class="hamburger" id="hamburger" aria-label="Menü"><span></span><span></span><span></span></button>
        <div class="ribbon-links" id="ribbonLinks">
          <a href="index.html#loesungen" class="ribbon-link">Lösungen</a>
          <a href="index.html#branchen" class="ribbon-link">Branchen</a>
          <a href="index.html#ueber-uns" class="ribbon-link">Über uns</a>
          <a href="index.html#kontakt" class="ribbon-link">Kontakt</a>
        </div>
      </div>
    </div>
  </nav>
  <div class="mobile-menu" id="mobileMenu">
    <a href="index.html#loesungen">Lösungen</a>
    <a href="index.html#branchen">Branchen</a>
    <a href="index.html#ueber-uns">Über uns</a>
    <a href="index.html#kontakt">Kontakt</a>
  </div>

  <!-- CONTENT -->
  <section class="bg-warm">
    <div class="container">
      <div class="success-wrap">
        <div class="success-icon">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
          </svg>
        </div>
        <h1 class="success-title"><strong>Vielen Dank</strong> für Ihre Anfrage.</h1>
        <p class="success-text">Wir werden uns zeitnah bei Ihnen melden. Wir freuen uns auf den Austausch!</p>
        <a href="index.html" class="success-btn">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
          </svg>
          Zurück
        </a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="footer-logo">Lakesights</a>
      <div class="footer-links"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a></div>
      <p class="footer-copy">© <span id="copy-year"></span> Lakesights. Alle Rechte vorbehalten.</p>
    </div>
  </footer>

  <script>
    // Nav scroll effect
    var ribbon = document.getElementById('ribbon');
    window.addEventListener('scroll', function() {
      ribbon.classList.toggle('scrolled', window.scrollY > 20);
    });

    // Mobile menu
    var hamburger = document.getElementById('hamburger');
    var mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', function() {
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('open');
    });
    var mobileLinks = mobileMenu.querySelectorAll('a');
    for (var i = 0; i < mobileLinks.length; i++) {
      mobileLinks[i].addEventListener('click', function() {
        hamburger.classList.remove('active');
        mobileMenu.classList.remove('open');
      });
    }

    // Dynamic copyright year
    document.getElementById('copy-year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
